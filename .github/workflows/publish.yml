name: Build, Test, and Publish

# Triggers:
#   - Automatically on any tag push matching semantic versioning (e.g. v1.0.0, v2.1.3-beta).
#   - Manually via the GitHub Actions UI (workflow_dispatch) for ad-hoc runs and local `act` testing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Check out the full repository history so that git tags are
      # available for version resolution during pack.
      # -----------------------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Install the .NET 8 SDK. This is the minimum SDK version that
      # can build .NET Standard 2.0 class libraries and net8.0 test projects.
      # -----------------------------------------------------------------------
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # -----------------------------------------------------------------------
      # Step 3: Restore all NuGet package references for the solution.
      # LlamaPure itself has zero library dependencies; only the test project
      # references xUnit and related packages.
      # -----------------------------------------------------------------------
      - name: Restore dependencies
        run: dotnet restore LlamaPure.sln

      # -----------------------------------------------------------------------
      # Step 4: Build the entire solution in Release configuration.
      # --no-restore avoids a redundant package restore after Step 3.
      # -----------------------------------------------------------------------
      - name: Build solution
        run: dotnet build LlamaPure.sln --configuration Release --no-restore

      # -----------------------------------------------------------------------
      # Step 5: Run the test suite.
      #
      # NOTE: Tests that exercise the real native inference path (embedding,
      # completion, dispose) require llama.dll, ggml.dll, ggml-base.dll, and
      # ggml-cpu.dll to be present in the test output directory. On this CI
      # runner those native binaries are not available, so model-dependent
      # tests are automatically skipped via the LLAMA_MODEL_PATH guard in the
      # test class. Only the initialization-error test (which expects a
      # graceful failure on an invalid path) will execute unconditionally.
      # -----------------------------------------------------------------------
      - name: Run tests
        run: dotnet test LlamaPure.Test/LlamaPure.Test.csproj --configuration Release --no-build

      # -----------------------------------------------------------------------
      # Step 6: Pack the NuGet package into ./artifacts/.
      # The package version is driven by the <Version> property in the .csproj
      # (or a Directory.Build.props override). When the workflow is triggered
      # by a tag push, you can optionally override the version by passing:
      #   -p:Version=${GITHUB_REF_NAME#v}
      # which strips the leading 'v' from the tag (e.g. v1.2.3 -> 1.2.3).
      # -----------------------------------------------------------------------
      - name: Pack NuGet package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && -n "$VERSION" ]]; then
            dotnet pack LlamaPure/LlamaPure.csproj \
              --configuration Release \
              --no-build \
              --output ./artifacts \
              -p:Version="$VERSION"
          else
            dotnet pack LlamaPure/LlamaPure.csproj \
              --configuration Release \
              --no-build \
              --output ./artifacts
          fi

      # -----------------------------------------------------------------------
      # Step 7: Upload the packed .nupkg to NuGet.org.
      #
      # Condition: runs ONLY when both of the following are true:
      #   a) The workflow was triggered by a tag push (github.ref_type == 'tag')
      #   b) The NUGET_API_KEY secret is configured in the repository settings
      #
      # This dual guard ensures that:
      #   - Manual workflow_dispatch runs and local `act` runs skip this step
      #     safely, even if the secret is absent.
      #   - A tag push without a configured secret fails loudly on this step
      #     rather than silently succeeding with an anonymous push.
      #
      # --skip-duplicate prevents the job from failing if the same version was
      # already published (e.g. after a re-run of a partially failed workflow).
      # -----------------------------------------------------------------------
      - name: Publish to NuGet.org
        if: github.ref_type == 'tag' && env.API_KEY != ''
        env:
          API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
